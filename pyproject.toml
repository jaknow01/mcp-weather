[project]
name = "mcp-weather"
version = "0.1.0"
description = "Current weather (OpenWeather) and forecasts (Open-Meteo) as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kuba" }]
dependencies = [
    "jarvis-mcp-kit @ git+https://github.com/jaknow01/jarvis-mcp-kit.git@v0.1.0",
    "pyowm>=3.5,<4",
    "requests>=2.31",
    "openmeteo-requests>=1.7,<2",
    "requests-cache>=1.2,<2",
    "retry-requests>=2,<3",
    "tzdata",
    "numpy>=1.26",
]

[project.scripts]
mcp-weather = "mcp_weather.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_weather"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
